<section class="section" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="container">
    <div class="cta">
      <h2 class="cta__title" id="{{id}}-title">{{heading}}</h2>
      {{#text}}<p class="cta__text">{{text}}</p>{{/text}}
      <div class="hero__actions">
        {{#primary}}<a class="btn btn--accent" href="{{href}}"><span aria-hidden="true">{{icon}}</span> {{label}}</a>{{/primary}}
        {{#secondary}}<a class="btn btn--ghost" href="{{href}}" rel="noopener"><span aria-hidden="true">{{icon}}</span> {{label}}</a>{{/secondary}}
      </div>
    </div>
  </div>
</section>
