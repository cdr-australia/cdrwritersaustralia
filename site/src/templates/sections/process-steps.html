<section class="section" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="container">
    <header class="section__head">
      <h2 class="section__title" id="{{id}}-title">{{heading}}</h2>
      {{#subheading}}<p class="section__sub">{{subheading}}</p>{{/subheading}}
    </header>
    <ol class="steps">
      {{#items}}
      <li class="step">
        <span class="step__icon" aria-hidden="true">{{icon}}</span>
        <h3 class="step__title">{{title}}</h3>
        <p class="step__text">{{text}}</p>
      </li>
      {{/items}}
    </ol>
  </div>
</section>
