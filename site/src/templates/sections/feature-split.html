<section class="section{{#alt}} section--alt{{/alt}}" id="{{id}}"{{#heading}} aria-labelledby="{{id}}-title"{{/heading}}>
  <div class="container">
    {{#heading}}
    <header class="section__head">
      <h2 class="section__title" id="{{id}}-title">{{heading}}</h2>
      {{#subheading}}<p class="section__sub">{{subheading}}</p>{{/subheading}}
    </header>
    {{/heading}}
    <div class="features">
      {{#items}}
      <article class="feature">
        <div class="feature__media"{{^image}} aria-hidden="true"{{/image}}>{{#image}}<img src="{{image}}" alt="{{imageAlt}}" loading="lazy">{{/image}}{{^image}}{{icon}}{{/image}}</div>
        <div class="feature__body">
          <h3 class="feature__title">{{title}}</h3>
          <p class="feature__text">{{text}}</p>
          {{#href}}<a class="feature__more" href="{{href}}">{{linkLabel}} →</a>{{/href}}
        </div>
      </article>
      {{/items}}
    </div>
  </div>
</section>
