<section class="section{{#alt}} section--alt{{/alt}}" id="{{id}}">
  <div class="container container--narrow">
    <aside class="notice notice--{{variant}}" role="note">
      <span class="notice__icon" aria-hidden="true">{{icon}}</span>
      <div class="notice__body">
        {{#title}}<p class="notice__title">{{title}}</p>{{/title}}
        <p class="notice__text">{{text}}</p>
      </div>
    </aside>
  </div>
</section>
