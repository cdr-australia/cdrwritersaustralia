<section class="section" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="container">
    <header class="section__head">
      <h2 class="section__title" id="{{id}}-title">{{heading}}</h2>
      {{#subheading}}<p class="section__sub">{{subheading}}</p>{{/subheading}}
    </header>

    <ul class="card-grid">
      {{#items}}
      <li>
        <article class="card">
          <span class="card__icon" aria-hidden="true">{{icon}}</span>
          {{#tag}}<span class="chip chip--tag">{{tag}}</span>{{/tag}}
          <h3 class="card__title"><a href="{{href}}">{{title}}</a></h3>
          <p class="card__text">{{text}}</p>
          <a class="card__more" href="{{href}}" aria-label="Learn more about {{title}}">Learn more →</a>
        </article>
      </li>
      {{/items}}
    </ul>
  </div>
</section>
