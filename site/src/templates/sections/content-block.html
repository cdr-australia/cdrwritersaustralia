<section class="section{{#alt}} section--alt{{/alt}}" id="{{id}}" aria-labelledby="{{id}}-title">
  <div class="container container--narrow">
    <h2 class="section__title section__title--left" id="{{id}}-title">{{#icon}}<span aria-hidden="true">{{icon}}</span> {{/icon}}{{heading}}</h2>
    <div class="prose">
      {{#paragraphs}}<p>{{.}}</p>{{/paragraphs}}
      {{#has_bullets}}
      <ul class="checklist">
        {{#bullets}}<li>{{.}}</li>{{/bullets}}
      </ul>
      {{/has_bullets}}
    </div>
  </div>
</section>
